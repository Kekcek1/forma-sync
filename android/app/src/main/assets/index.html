<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Форма — дневник тренировок и восстановления</title>
<meta name="description" content="Локальный дневник тренировок и восстановления. Работает без сети.">
<meta name="theme-color" content="#0E1114">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-today" viewBox="0 0 24 24"><path d="M4 13h4l2 5 4-12 2 7h4"/></symbol>
  <symbol id="i-workouts" viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></symbol>
  <symbol id="i-recovery" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4L3 10M4 13a8 8 0 0 0 14 4l3-3"/><path d="M3 5v5h5M21 19v-5h-5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l4-1 11-11-4-4L4 15Z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m-5-5 5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V8m-5 5 5-5 5 5M5 4h14"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.6-7 9-7 9Z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></symbol>
</svg>

<div class="shell">
  <aside class="rail" aria-label="Основная навигация">
    <a class="brand" href="#/today" aria-label="Форма">
      <span class="brand__mark">Ф</span>
      <span class="brand__text">форма</span>
    </a>
    <nav class="rail__nav">
      <a class="rail__item" href="#/today" data-route="today"><svg><use href="#i-today"/></svg><span>Сегодня</span></a>
      <a class="rail__item" href="#/workouts" data-route="workouts"><svg><use href="#i-workouts"/></svg><span>Тренировки</span></a>
      <a class="rail__item" href="#/recovery" data-route="recovery"><svg><use href="#i-recovery"/></svg><span>Восстановление</span></a>
      <a class="rail__item" href="#/stats" data-route="stats"><svg><use href="#i-stats"/></svg><span>Статистика</span></a>
    </nav>
    <div class="rail__bottom">
      <a class="rail__item" href="#/settings" data-route="settings"><svg><use href="#i-settings"/></svg><span>Настройки</span></a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar__left">
        <h1 id="page-title">Сегодня</h1>
        <p id="page-sub" class="topbar__sub"></p>
      </div>
      <div class="topbar__right">
        <button id="sync-pill" class="pill" type="button" hidden>
          <svg><use href="#i-sync"/></svg><span>Синхронизация</span>
        </button>
        <a class="avatar" href="#/settings" aria-label="Профиль"><svg><use href="#i-user"/></svg></a>
      </div>
    </header>
    <section id="view" class="view" tabindex="-1"></section>
  </main>
</div>

<nav class="tabbar" aria-label="Навигация">
  <a href="#/today" data-route="today"><svg><use href="#i-today"/></svg><span>Сегодня</span></a>
  <a href="#/workouts" data-route="workouts"><svg><use href="#i-workouts"/></svg><span>Тренировки</span></a>
  <button class="tabbar__add" id="quick-add" type="button" aria-label="Добавить запись"><svg><use href="#i-plus"/></svg></button>
  <a href="#/recovery" data-route="recovery"><svg><use href="#i-recovery"/></svg><span>Восстановление</span></a>
  <a href="#/stats" data-route="stats"><svg><use href="#i-stats"/></svg><span>Статистика</span></a>
</nav>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
